# Edge server: serves the built SPA and load-balances WebSocket traffic
# across every gateway replica. `upstream` + Docker's embedded DNS means
# `docker compose up --scale gateway=3` is picked up at nginx start.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream consensuskill_gateway {
    # Docker Compose DNS returns one A record per gateway replica.
    server gateway:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: every route falls back to index.html (the app is one page).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        proxy_pass http://consensuskill_gateway/health;
        access_log off;
    }

    location /ws {
        proxy_pass http://consensuskill_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Rooms can sit idle for minutes between messages; never time out a
        # live socket (the client also pings, but be generous).
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
