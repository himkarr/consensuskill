[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
filterwarnings = [
    "ignore::DeprecationWarning:multipart",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "node_modules", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
