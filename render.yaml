# Render blueprint: one free web service = gateway + embedded round engine.
#
# Free plan fits exactly 750 instance-hours/month, so we run a SINGLE service
# (two services would need 2 x 730). Redis lives in Upstash (separate free
# tier); paste its rediss:// URL into REDIS_URL below when you first deploy.
#
# Note: the service sleeps after ~15 min without traffic (~1 min cold start)
# and in-memory room state in Redis survives, but active sockets drop - the
# frontend reconnects with its player token. See details.md Phase 4.
services:
  - type: web
    name: consensuskill
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    startCommand: sh ./deploy/render-entry.sh
    healthCheckPath: /health
    envVars:
      - key: REDIS_URL
        sync: false # paste: rediss://default:<password>@<host>.upstash.io
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: INSTANCE_ID
        generateValue: true
      # Kept here as well as in render-entry.sh so the Dockerfile's default
      # CMD (uvicorn gateway...) is correct even if startCommand is ignored.
      - key: EMBEDDED_ENGINE
        value: "1"
      - key: ENGINE_BLOCK_MS
        value: "0"
      - key: ENGINE_EMPTY_POLL_DELAY
        value: "30"
      - key: ENGINE_RESCAN_SECONDS
        value: "30"
      - key: ENGINE_IDLE_TICK_SECONDS
        value: "60"
      - key: ENGINE_SWEEP_SECONDS
        value: "300"
